<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5e"/>
      <stop offset="100%" stop-color="#ff1a35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#262b3d" stroke-width="12"/>
  
  <!-- Stylized Geometric 'A' in white -->
  <path d="M120 380 L220 130 L270 130 L195 380 Z" fill="#ffffff"/>
  <path d="M150 310 L270 310 L260 270 L170 270 Z" fill="#ffffff"/>
  
  <!-- Stylized Modern 'X' in vibrant red with glow -->
  <g filter="url(#glow)">
    <path d="M260 130 L400 380 L350 380 L220 150 Z" fill="url(#redGrad)"/>
    <path d="M375 130 L240 380 L285 380 L420 130 Z" fill="url(#redGrad)"/>
  </g>
</svg>